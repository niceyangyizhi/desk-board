<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="提示板" />
<meta name="format-detection" content="telephone=no" />
<meta name="theme-color" content="#f3f0e7" />
<title>提示板</title>
<style>
  :root{
    --paper:#f3f0e7;
    --ink:#191811;
    --ink-2:#4a4739;
    --muted:#8d8877;
    --rule:#dcd6c4;
    --serif:"New York","Iowan Old Style","Palatino Linotype",Palatino,"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
    --pad-x:54px;
  }
  /* 夜间：dim = 暗纸（默认，接近真墨水屏低光态） / invert = 反色（OLED 更省电） */
  body.dim{
    --paper:#d9d3c0; --ink:#221f17; --ink-2:#4c4838; --muted:#7c7663; --rule:#c2bba6;
  }
  body.invert{
    --paper:#14130e; --ink:#d9d3c1; --ink-2:#a29c8a; --muted:#6e6959; --rule:#2b2820;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:background-color .9s ease,color .9s ease;
  }
  /* 极轻的纸纹 */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.055;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
    background-size:180px 180px;
  }
  body.invert::after{opacity:.035}

  #board{
    position:relative;z-index:1;
    height:100%;
    display:flex;flex-direction:column;
    padding:26px var(--pad-x) calc(36px + env(safe-area-inset-bottom, 0px));
    transition:transform 1s ease;
  }

  /* ---------- 顶部：地点 / 日期 ---------- */
  #topbar{
    display:flex;align-items:baseline;justify-content:space-between;gap:24px;
    padding-bottom:11px;
    border-bottom:1px solid var(--rule);
  }
  .loc{font-size:13px;letter-spacing:.24em;color:var(--ink-2);white-space:nowrap}
  .loc .mark{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink-2);vertical-align:3px;margin-right:12px}
  .daynum{font-size:12.5px;letter-spacing:.16em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ---------- 时间 + 天气 ---------- */
  #hero{
    display:flex;align-items:flex-start;justify-content:space-between;gap:48px;
    padding:20px 0 18px;
  }
  #clock{
    font-family:var(--serif);
    font-size:clamp(86px,13.2vw,158px);
    line-height:.82;
    letter-spacing:-.015em;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
    margin-left:-4px;
    cursor:default;
    flex:0 0 auto;
  }

  #weather{flex:0 0 auto;max-width:60%;padding-top:6px;text-align:right;min-width:0}
  .wline{display:flex;align-items:center;justify-content:flex-end;gap:13px}
  #icon{width:34px;height:34px;flex:0 0 auto;color:var(--ink-2)}
  #icon svg{width:100%;height:100%;display:block}
  #temp{
    font-family:var(--serif);font-size:52px;line-height:.86;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  }
  #temp .deg{font-size:.42em;vertical-align:.62em;letter-spacing:0;margin-left:.03em;color:var(--ink-2)}
  #cond{font-size:16px;letter-spacing:.1em;color:var(--ink-2);white-space:nowrap}

  .wmeta{
    margin-top:10px;
    display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px 18px;
    font-size:12.5px;color:var(--muted);letter-spacing:.04em;
  }
  .wmeta b{font-weight:400;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-left:6px;letter-spacing:.02em}

  #indoor{display:none;margin-top:7px;font-size:12.5px;color:var(--muted);letter-spacing:.04em}
  #indoor.on{display:block}
  #indoor b{font-weight:400;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-left:6px}

  /* ---------- 待办（整行宽度） ---------- */
  #left{
    flex:0 0 auto;min-height:0;
    display:flex;flex-direction:column;
    border-top:1px solid var(--rule);
    padding-top:14px;
  }
  .sec{
    display:flex;justify-content:space-between;align-items:baseline;gap:16px;
    font-size:11.5px;letter-spacing:.3em;color:var(--muted);
  }
  .sec .n{font-variant-numeric:tabular-nums;letter-spacing:.12em}
  #todoHead{cursor:pointer;justify-content:flex-start;gap:14px}

  /* 两列：左右交替（1 2 / 3 4 / 5 6 …） */
  #todoList{
    list-style:none;margin:10px 0 0;padding:0;
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-rows:repeat(var(--rows,1),62px);
    grid-auto-flow:row;
    column-gap:56px;row-gap:0;
    min-height:0;flex:0 1 auto;
  }
  .todo{
    display:grid;grid-template-columns:20px 62px minmax(0,1fr);
    align-items:end;gap:16px;
    padding:0 0 9px 1px;border-bottom:1px solid var(--rule);
    cursor:default;
  }
  /* 待办较多时压缩行高 */
  #left.tight .todo{padding:0 0 5px 1px}
  #left.tight .todo .txt{font-size:20.5px}

  .box{
    position:relative;top:0;
    width:13px;height:13px;border:1px solid var(--ink-2);border-radius:2px;
    transition:background-color .25s ease,border-color .25s ease;
    cursor:pointer;
  }
  /* 扩大点击热区，但不影响文字区域 */
  .box::before{content:"";position:absolute;inset:-16px -12px}
  .todo.done .box{background:var(--ink);border-color:var(--ink)}
  .todo.done .box::after{
    content:"";position:absolute;left:4px;top:1px;width:4px;height:7.5px;
    border-right:1.5px solid var(--paper);border-bottom:1.5px solid var(--paper);
    transform:rotate(38deg);
  }
  .todo .tm{
    font-size:13.5px;color:var(--muted);letter-spacing:.08em;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .todo .txt{
    font-family:var(--serif);font-size:22px;line-height:1.34;letter-spacing:.01em;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .todo.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}

  .addline{
    display:flex;align-items:center;gap:12px;
    padding:12px 0 10px;margin-top:0;
    font-size:14px;letter-spacing:.14em;color:var(--ink-2);
    cursor:pointer;
  }
  .addline .plus{
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
    width:16px;height:16px;border:1px solid var(--rule);border-radius:2px;
    font-size:13px;line-height:1;color:var(--muted);
  }
  .addline .more{margin-left:auto;font-size:12px;letter-spacing:.08em;opacity:.9}
  .addline:active{opacity:.55}

  /* ---------- 底部：健康提示 + 状态 ---------- */
  #footarea{margin-top:auto;padding-top:12px;border-top:1px solid var(--rule)}
  #tipbar{display:flex;align-items:baseline;gap:16px;min-width:0}
  #tipbar .k{flex:0 0 auto;font-size:10.5px;letter-spacing:.3em;color:var(--muted)}
  #tip{
    font-family:var(--serif);font-size:17px;line-height:1.5;letter-spacing:.02em;
    color:var(--ink-2);margin:0;transition:opacity .55s ease;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  #tip.fade{opacity:0}

  #statusline{
    display:flex;justify-content:space-between;align-items:baseline;gap:20px;
    margin-top:7px;font-size:10.5px;letter-spacing:.18em;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  #statusline .r{opacity:.75}

  /* ---------- 待办面板 ---------- */
  #sheet{
    position:fixed;inset:0;z-index:30;
    background:var(--paper);color:var(--ink);
    display:none;flex-direction:column;
    padding:34px 46px calc(22px + env(safe-area-inset-bottom, 0px));
    font-family:var(--sans);
  }
  #sheet.on{display:flex}
  .sheet-head{display:flex;align-items:baseline;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
  .sheet-head h2{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:.14em;margin:0}
  .sheet-head .d{font-size:12.5px;letter-spacing:.1em;color:var(--muted);font-variant-numeric:tabular-nums}
  .sheet-head .x{
    margin-left:auto;flex:0 0 auto;
    background:transparent;border:1px solid var(--rule);border-radius:2px;
    color:var(--ink);font-family:var(--sans);font-size:13px;letter-spacing:.18em;
    padding:9px 22px;cursor:pointer;
  }

  #addForm{display:grid;grid-template-columns:104px minmax(0,1fr) 52px;gap:12px;margin-top:18px}
  #addForm input{
    background:transparent;border:1px solid var(--rule);border-radius:2px;
    color:var(--ink);outline:none;width:100%;
    font-family:var(--serif);font-size:19px;padding:13px 15px;
    -webkit-user-select:text;user-select:text;
  }
  #addForm #addTime{
    font-family:var(--sans);font-size:16px;color:var(--ink-2);
    padding:13px 6px;text-align:center;
    -webkit-appearance:none;appearance:none;
  }
  input[type="time"]::-webkit-calendar-picker-indicator{opacity:0;width:100%;position:absolute;inset:0;cursor:pointer}
  #addForm #addTime{position:relative}
  #addForm input::placeholder{color:var(--muted);font-family:var(--sans);font-size:15px;letter-spacing:.04em}
  #addForm #btnAdd{
    background:var(--ink);color:var(--paper);border:none;border-radius:2px;
    font-size:20px;line-height:1;cursor:pointer;
  }

  #sheetList{margin-top:10px;flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
  .srow{
    display:grid;grid-template-columns:26px minmax(0,1fr) 104px 40px;
    align-items:center;gap:8px;
    border-bottom:1px solid var(--rule);
  }
  .srow .cb{
    width:17px;height:17px;border:1px solid var(--ink-2);border-radius:2px;
    background:transparent;position:relative;cursor:pointer;padding:0;
  }
  .srow .cb::before{content:"";position:absolute;inset:-13px -8px}
  .srow.done .cb{background:var(--ink);border-color:var(--ink)}
  .srow.done .cb::after{
    content:"";position:absolute;left:5px;top:1.5px;width:4.5px;height:8.5px;
    border-right:1.5px solid var(--paper);border-bottom:1.5px solid var(--paper);
    transform:rotate(38deg);
  }
  .srow input.t{
    background:transparent;border:none;outline:none;width:100%;
    font-family:var(--serif);font-size:20px;color:var(--ink);padding:14px 4px;
    -webkit-user-select:text;user-select:text;
  }
  .srow.done input.t{color:var(--muted);text-decoration:line-through}
  .srow input.tm{
    background:transparent;border:none;outline:none;
    font-family:var(--sans);font-size:16px;color:var(--ink-2);
    text-align:right;padding:14px 0;width:100%;
    -webkit-appearance:none;appearance:none;
  }
  .srow .del{
    background:transparent;border:none;color:var(--muted);
    font-size:21px;line-height:1;cursor:pointer;padding:8px 0;
  }
  .srow .del:active{color:var(--ink)}
  #sheetList .empty{font-family:var(--serif);font-size:18px;color:var(--muted);padding:28px 0;letter-spacing:.02em}

  .sheet-foot{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding-top:13px;border-top:1px solid var(--rule);
    font-size:11.5px;color:var(--muted);letter-spacing:.06em;
  }
  .sheet-foot button{
    background:transparent;border:1px solid var(--rule);border-radius:2px;
    color:var(--ink-2);font-family:var(--sans);font-size:12.5px;letter-spacing:.1em;
    padding:9px 16px;cursor:pointer;
  }
  .sheet-foot .note{margin-left:auto;letter-spacing:.04em}

  /* ---------- 统计页 ---------- */
  #stats{
    position:fixed;inset:0;z-index:31;
    background:var(--paper);color:var(--ink);
    display:none;flex-direction:column;
    padding:30px 46px calc(18px + env(safe-area-inset-bottom, 0px));
    font-family:var(--sans);
  }
  #stats.on{display:flex}
  .st-head{display:flex;align-items:baseline;gap:20px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
  .st-head h2{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:.14em;margin:0}
  .st-head .nums{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline}
  .st-head .nums .n{display:flex;align-items:baseline;gap:6px}
  .st-head .nums b{
    font-family:var(--serif);font-weight:400;font-size:20px;color:var(--ink);
    font-variant-numeric:tabular-nums;letter-spacing:0;
  }
  .st-head .nums span{font-size:11px;letter-spacing:.18em;color:var(--muted)}
  .st-head .x{
    margin-left:auto;flex:0 0 auto;
    background:transparent;border:1px solid var(--rule);border-radius:2px;
    color:var(--ink);font-family:var(--sans);font-size:13px;letter-spacing:.18em;
    padding:9px 22px;cursor:pointer;
  }

  .st-sec{margin-top:20px;min-width:0}
  .st-label{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:10.5px;letter-spacing:.28em;color:var(--muted)}
  .st-label .r{letter-spacing:.08em;white-space:nowrap}

  #heat{margin-top:10px}
  .hm-months{display:grid;grid-auto-flow:column;grid-auto-columns:21px;height:12px;margin-left:27px;font-size:9px;color:var(--muted)}
  .hm-months span{white-space:nowrap;overflow:visible}
  .hm-body{display:flex;margin-top:3px}
  .hm-days{
    display:grid;grid-template-rows:repeat(7,17px);row-gap:4px;
    width:27px;font-size:9px;color:var(--muted);align-items:center;
  }
  .hm-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,17px);grid-auto-columns:17px;gap:4px}
  .hm-grid i{display:block;background:var(--ink);opacity:.07;border-radius:1px}
  .hm-grid i.l1{opacity:.24}
  .hm-grid i.l2{opacity:.42}
  .hm-grid i.l3{opacity:.64}
  .hm-grid i.l4{opacity:.86}
  .hm-grid i.void{opacity:0}
  .hm-grid i.today{outline:1px solid var(--ink-2);outline-offset:1px}

  #bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;height:88px;margin-top:12px;
        border-bottom:1px solid var(--rule);align-items:end}
  .bar{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
  .bar span{display:block;width:100%}
  .bar .u{background:var(--rule);border-radius:1px 1px 0 0}
  .bar .f{background:var(--ink);border-radius:1px 1px 0 0}
  .bar.empty::after{content:"";display:block;height:1px;background:var(--rule)}
  #barsAxis{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;margin-top:6px;font-size:9.5px;color:var(--muted)}
  #barsAxis span{text-align:center;font-variant-numeric:tabular-nums}

  .st-hist{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
  #hist{flex:1 1 auto;min-height:0;overflow:auto;margin-top:6px;-webkit-overflow-scrolling:touch}
  .hblock{border-bottom:1px solid var(--rule)}
  .hrow{
    display:grid;grid-template-columns:110px 54px 1fr 64px 16px;align-items:baseline;gap:10px;
    padding:11px 2px;cursor:pointer;
  }
  .hrow .d{font-family:var(--serif);font-size:17px;color:var(--ink)}
  .hrow .w{font-size:11px;color:var(--muted);letter-spacing:.1em}
  .hrow .n{text-align:right;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .hrow .c{text-align:right;color:var(--muted);font-size:13px;transition:transform .2s}
  .hrow.open .c{transform:rotate(90deg)}
  .hitems{display:none;padding:0 0 12px 2px;max-width:720px}
  .hrow.open + .hitems{display:block}
  .hi{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:12px;padding:5px 0;font-size:14px;color:var(--ink-2)}
  .hi .t{font-family:var(--serif);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hi .m{text-align:right;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .hi.done .t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
  #hist .empty{font-family:var(--serif);font-size:16px;color:var(--muted);padding:24px 0;letter-spacing:.02em}

  .st-foot{
    display:flex;align-items:center;gap:12px;
    padding-top:12px;margin-top:10px;border-top:1px solid var(--rule);
    font-size:11.5px;color:var(--muted);letter-spacing:.06em;
  }
  .st-foot button{
    background:transparent;border:1px solid var(--rule);border-radius:2px;
    color:var(--ink-2);font-family:var(--sans);font-size:12.5px;letter-spacing:.1em;
    padding:9px 16px;cursor:pointer;
  }
  .st-foot .note{margin-left:auto;letter-spacing:.04em}

  @media (max-width:760px){
    :root{--pad-x:26px}
    #board{padding-top:18px}
    #hero{gap:18px;padding:16px 0 14px}
    #clock{font-size:clamp(62px,17vw,120px)}
    #weather{max-width:54%}
    #temp{font-size:38px}
    #cond{font-size:14px}
    .wmeta{font-size:11px;gap:3px 10px}
    .todo{grid-template-columns:18px 54px minmax(0,1fr);gap:12px}
    #tip{font-size:15px}
    #sheet{padding:20px 18px calc(18px + env(safe-area-inset-bottom, 0px))}
    #addForm{grid-template-columns:90px minmax(0,1fr) 46px;gap:8px}
    .srow{grid-template-columns:23px minmax(0,1fr) 86px 34px;gap:6px}
    #stats{padding:20px 16px calc(16px + env(safe-area-inset-bottom, 0px))}
    .st-head{gap:10px;flex-wrap:wrap}
    .st-head .nums{gap:14px}
    .hm-months{display:none}
    .hm-body{margin-top:2px}
    .hrow{grid-template-columns:74px 34px 1fr 46px 12px;gap:6px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main id="board">
  <header id="topbar">
    <div class="loc"><span class="mark"></span><span id="locName">上海 · 杨浦</span></div>
    <div class="daynum" id="daynum">2026.10.27 · 星期二</div>
  </header>

  <section id="hero">
    <div id="clock" title="轻点三次可编辑待办">--:--</div>

    <div id="weather">
      <div class="wline">
        <span id="icon"></span>
        <span id="temp">--<span class="deg">°</span></span>
        <span id="cond">正在获取天气…</span>
      </div>
      <div class="wmeta" id="wmeta"></div>
      <div id="indoor"></div>
    </div>
  </section>

  <section id="left">
    <div class="sec" id="todoHead" role="button" tabindex="0"><span>今日</span><span class="n" id="todoProgress">0/0</span></div>
    <ul id="todoList"></ul>
    <div class="addline" id="addLine" role="button" tabindex="0">
      <span class="plus">＋</span><span>添加待办</span><span class="more" id="addMore"></span>
    </div>
  </section>

  <footer id="footarea">
    <div id="tipbar">
      <span class="k" id="tipLabel">健康提示</span>
      <span id="tip">—</span>
    </div>
    <div id="statusline">
      <span id="statusL">正在载入</span>
      <span class="r"><span id="buildTag"></span>三击时钟 · 编辑待办</span>
    </div>
  </footer>
</main>

<div id="sheet">
  <div class="sheet-head">
    <h2>今日待办</h2>
    <span class="d" id="sheetDate"></span>
    <button class="x" id="btnClose">完成</button>
  </div>

  <form id="addForm" autocomplete="off">
    <input id="addTime" type="time" aria-label="时间（可留空）">
    <input id="addText" type="text" placeholder="添加一件事…" enterkeyhint="done"
           autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="待办内容">
    <button id="btnAdd" type="submit" aria-label="添加">＋</button>
  </form>

  <div id="sheetList"></div>

  <div class="sheet-foot">
    <button id="btnStats">统计</button>

    if (n < 30) return "二十" + CN_NUM[n - 20] + "日";

      const r = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);

  let nightClass = "";
  function applyNight(hour) {
    let mode = FORCE_NIGHT || CONFIG.display.nightMode;

      const isNight = s <= e ? (hour >= s && hour < e) : (hour >= s || hour < e);

    const cls = mode === "invert" ? "invert" : (mode === "dim" ? "dim" : "");

    try {
      const j = await getJSON(weatherURL());
      const c = j.current, d = j.daily;
      state.weather = {
        temp: c.temperature_2m,
        feels: c.apparent_temperature,
        hum: c.relative_humidity_2m,
        code: c.weather_code,
        wind: c.wind_speed_10m,
        isDay: c.is_day === 1,
        tmax: d.temperature_2m_max[0],
        tmin: d.temperature_2m_min[0],
        sunrise: (d.sunrise[0] || "").slice(11, 16),
        sunset: (d.sunset[0] || "").slice(11, 16),
        dayCode: d.weather_code[0],
        at: Date.now()
      };
      state.stale = false;
      writeJSON("board.weather", state.weather);
      state.lastWeatherAt = Date.now();
    } catch (e) {
      const cached = readJSON("board.weather", null);
      if (cached) { state.weather = cached; state.stale = true; }
    }
    renderWeather();
  }

  function aqiGrade(v) {
    if (v == null) return "";
    if (v <= 50) return "优";
    if (v <= 100) return "良";
    if (v <= 150) return "轻度污染";
    if (v <= 200) return "中度污染";
    if (v <= 300) return "重度污染";
    return "严重污染";
  }

  async function loadAqi() {
    if (!CONFIG.weather.showAqi) return;
    if (DEMO_MODE) { state.aqi = DEMO.aqi; renderWeather(); return; }
    try {
      const j = await getJSON(aqiURL());
      state.aqi = { value: j.current.us_aqi, pm: j.current.pm2_5 };
      writeJSON("board.aqi", state.aqi);
      state.lastAqiAt = Date.now();
    } catch (e) {
      state.aqi = readJSON("board.aqi", null);
    }
    renderWeather();
  }

  function renderWeather() {
    const w = state.weather;
    if (!w) return;
    const [text, icon] = wmo(w.code);

    $("#temp").innerHTML = Math.round(w.temp) + '<span class="deg">°</span>';
    $("#cond").textContent = text;
    $("#icon").innerHTML = iconSVG(icon, w.isDay);

    const meta = [];
    meta.push(["体感", Math.round(w.feels) + "°"]);
    meta.push(["湿度", Math.round(w.hum) + "%"]);
    meta.push(["风", (w.wind == null ? "—" : w.wind.toFixed(1)) + " km/h"]);
    meta.push(["最高 / 最低", Math.round(w.tmax) + "° / " + Math.round(w.tmin) + "°"]);
    if (CONFIG.weather.showAqi && state.aqi && state.aqi.value != null) {
      meta.push(["空气", aqiGrade(state.aqi.value) + " " + Math.round(state.aqi.value)]);
    }

    $("#wmeta").innerHTML = meta.map(m => "<span>" + m[0] + "<b>" + m[1] + "</b></span>").join("");
    renderTip();
  }

     8. 室内温湿度（可选）

  /* =====================================================================
     9. 待办（本地存储，iPad 上直接增删改）
     ===================================================================== */
  const TODO_KEY = "board.todos";

  function dayKey(p) {
    p = p || nowParts();
    return p.y + "-" + pad2(p.m) + "-" + pad2(p.d);
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function withId(t) {
    return { id: t.id || uid(), time: t.time || "", text: String(t.text || ""), done: !!t.done };
  }
  function normTodo(t) {
    if (typeof t === "string") return withId({ text: t });
    return withId({ id: t.id, time: t.time, text: t.text, done: t.done });
  }

  // 有时间的按时间排在前，没时间的保持添加顺序排在后
  function sortItems(list) {
    return list.slice().sort((a, b) => {
      const at = a.time ? 1 : 0, bt = b.time ? 1 : 0;
      if (at !== bt) return bt - at;
      return at && bt ? a.time.localeCompare(b.time) : 0;
    });
  }

  function saveTodos() {
    if (DEMO_MODE) return;
    const now = Date.now();
    state.todosSavedAt = now;
    const payload = {
      v: 3,
      day: state.todoDay,
      items: state.todos,
      history: state.history || {},
      savedAt: now
    };
    try {
      localStorage.setItem(TODO_KEY, JSON.stringify(payload));
    } catch (err) {
      // 超出本地配额：丢掉最老的一半历史再试一次
      const ks = Object.keys(payload.history).sort();
      ks.slice(0, Math.ceil(ks.length / 2)).forEach(k => delete payload.history[k]);
      try { localStorage.setItem(TODO_KEY, JSON.stringify(payload)); } catch (e2) {}
    }
    state.todoSource = "local";
  }

  // 把某一天的完整清单（含未完成）写进历史
  function snapshotDay(day, items) {
    if (!day || !items.length) return;
    state.history[day] = {
      items: items.map(i => ({ t: i.text, m: i.time || "", d: i.done ? 1 : 0 })),
      at: Date.now()
    };
  }

  // 跨天：先把昨天完整留档，再把没做完的顺延到今天
  function rollOverDay() {
    const today = dayKey();
    if (!state.todoDay) { state.todoDay = today; return false; }
    if (state.todoDay === today) return false;

    if (CONFIG.todos.dailyArchive) {
      snapshotDay(state.todoDay, state.todos);
      state.todos = state.todos.filter(t => !t.done);
    }
    state.todoDay = today;
    saveTodos();
    return true;
  }

  // 另一处（Safari 标签页 / 主屏 App）改过数据时，把较新的那份同步过来
  function syncFromStorage() {
    if (DEMO_MODE) return;
    const raw = readJSON(TODO_KEY, null);
    if (!raw || !Array.isArray(raw.items)) return;
    const stamp = raw.savedAt || 0;
    if (stamp <= state.todosSavedAt) return;

    state.todosSavedAt = stamp;
    state.todos = raw.items.map(normTodo).filter(t => t.text);
    state.history = {};
    Object.keys(raw.history || {}).forEach(k => {
      const d = raw.history[k];
      if (d && Array.isArray(d.items)) state.history[k] = d;
    });
    state.todoDay = raw.day || dayKey();
    rollOverDay();
    renderTodos();
    if (sheet.classList.contains("on")) renderSheet();
    if (statsEl.classList.contains("on")) renderStats();
    renderStatus();
  }

  async function loadTodos() {
    state.todoDay = state.todoDay || dayKey();
    state.history = state.history || {};

    if (DEMO_MODE) {
      state.todos = DEMO.todos.map(normTodo);
      state.todoSource = "demo";
      renderTodos();
      return;
    }

    const raw = readJSON(TODO_KEY, null);

    if (raw && Array.isArray(raw.items)) {
      state.todos = raw.items.map(normTodo).filter(t => t.text);

      // 历史：v3 直接读；v2 的 archive（只有已完成项）迁移过来
      state.history = {};
      if (raw.history && typeof raw.history === "object") {
        Object.keys(raw.history).forEach(k => {
          const d = raw.history[k];
          if (d && Array.isArray(d.items)) state.history[k] = d;
        });
      } else if (Array.isArray(raw.archive)) {
        raw.archive.forEach(a => {
          if (!a || !a.day || !Array.isArray(a.items)) return;
          if (state.history[a.day]) return;
          state.history[a.day] = {
            items: a.items.map(i => ({ t: i.text, m: i.time || "", d: 1 })),
            at: 0
          };
        });
      }

      state.todoDay = raw.day || dayKey();
      state.todosSavedAt = raw.savedAt || 0;
      state.todoSource = "local";
      rollOverDay();
    } else {
      // 第一次运行：用 todos.json 播一次种，之后不再自动覆盖
      state.todos = [];
      state.history = {};
      if (CONFIG.todos.seedFromJson) {
        try {
          const j = await getJSON(CONFIG.todos.url, 5000);
          const arr = Array.isArray(j) ? j : (j && j.items);
          if (Array.isArray(arr)) state.todos = arr.map(normTodo).filter(t => t.text);
        } catch (e) {}
      }
      saveTodos();
    }
    renderTodos();
  }

  function renderTodos() {
    rollOverDay();

    const list = state.todos;
    const done = list.filter(t => t.done).length;
    $("#todoProgress").textContent = done + "/" + list.length;

    const max = CONFIG.todos.maxShow;
    const shown = sortItems(list).slice(0, max);

    $("#todoList").innerHTML = shown.map(t =>
      '<li class="todo' + (t.done ? " done" : "") + '" data-id="' + t.id + '">' +
        '<span class="box" role="button" tabindex="0" aria-label="标记完成"></span>' +
        '<span class="tm">' + esc(t.time || "") + "</span>" +
        '<span class="txt">' + esc(t.text) + "</span>" +
      "</li>"
    ).join("");

    $("#todoList").style.setProperty("--rows", String(Math.max(1, Math.ceil(shown.length / 2))));

    const rest = list.length - shown.length;
    $("#addMore").textContent = rest > 0 ? "还有 " + rest + " 项" : "";
    $("#left").classList.toggle("tight", shown.length > 12);
  }

  function addTodo(text, time) {
    const t = text.trim();
    if (!t) return;
    state.todos.push({ id: uid(), time: time || "", text: t, done: false });
    saveTodos();
    renderTodos();
    if (sheet.classList.contains("on")) renderSheet();
    renderStatus();
  }

  function toggleTodo(id) {
    const t = state.todos.find(x => x.id === id);
    if (!t) return;
    t.done = !t.done;
    saveTodos();
    renderTodos();
    renderStatus();
  }

  function deleteTodo(id) {
    state.todos = state.todos.filter(t => t.id !== id);
    saveTodos();
    renderTodos();
    if (sheet && sheet.classList.contains("on")) renderSheet();
    renderStatus();
  }

  $("#todoList").addEventListener("click", e => {
    const box = e.target.closest(".box");
    if (!box) return;                      // 点文字或空白不勾选
    const li = box.closest(".todo");
    if (li) toggleTodo(li.dataset.id);
  });

  /* =====================================================================
     10. 健康提示
     ===================================================================== */
  let tipText = "";

  function tipContext() {
    const w = state.weather;
    if (!w) return null;
    const c = w.code;
    return {
      rain: [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 96, 99].indexOf(c) >= 0,
      snow: [71, 73, 75, 77, 85, 86].indexOf(c) >= 0,
      storm: [95, 96, 99].indexOf(c) >= 0,
      fog: [45, 48].indexOf(c) >= 0,
      temp: w.temp,
      feels: w.feels,
      hum: w.hum,
      wind: w.wind,
      aqi: state.aqi && state.aqi.value != null ? state.aqi.value : null
    };
  }

  // "aqi>=100" / "rain" 这样的小表达式
  function matchCond(cond, c) {
    if (!cond) return false;
    const m = String(cond).trim().match(/^([a-z]+)\s*(>=|<=|>|<)?\s*(-?[\d.]+)?$/);
    if (!m) return false;
    const key = m[1], op = m[2], val = m[3] === undefined ? null : parseFloat(m[3]);
    if (!op) return !!c[key];
    if (c[key] == null || isNaN(val)) return false;
    if (op === ">") return c[key] > val;
    if (op === "<") return c[key] < val;
    if (op === ">=") return c[key] >= val;
    return c[key] <= val;
  }

  function pickConditional() {
    const c = tipContext();
    if (!c) return null;
    const rules = CONFIG.tips.conditional || [];
    for (let i = 0; i < rules.length; i++) {
      if (matchCond(rules[i].cond, c)) return rules[i].text;
    }
    return null;
  }

  function currentSlot() {
    const h = nowParts().hh;
    const slots = CONFIG.tips.timeSlots || [];
    for (let i = 0; i < slots.length; i++) {
      const s = slots[i];
      const hit = s.from <= s.to ? (h >= s.from && h < s.to) : (h >= s.from || h < s.to);
      if (hit) return s;
    }
    return slots[0] || { name: "健康提示", list: [] };
  }

  // 时段的前半程显示时段专属，后半程显示通用
  function slotHalf(slot) {
    const p = nowParts();
    const h = p.hh + p.mm / 60;
    const from = slot.from, to = slot.to;
    const dur = to > from ? to - from : to + 24 - from;
    const elapsed = h >= from ? h - from : h + 24 - from;
    return elapsed < dur / 2;
  }

  function renderTip() {
    let text = "", label = "健康提示";

    const cond = pickConditional();
    if (cond) {
      // 1. 当天实况（下雨、空气差、极冷极热…）
      text = cond;
      label = "今日提醒";
    } else {
      // 2. 此刻所在时段：前半程用时段专属，后半程用通用
      const slot = currentSlot();
      const si = Math.max(0, (CONFIG.tips.timeSlots || []).indexOf(slot));
      const pool = slotHalf(slot) ? (slot.list || []) : (CONFIG.tips.general || []);
      if (pool.length) {
        let idx;
        if (CONFIG.tips.mode === "rotate") {
          idx = (Math.floor(Date.now() / (CONFIG.tips.rotateMinutes * 60000)) + si * 3) % pool.length;
        } else {
          const p = nowParts();
          idx = (dayOfYear(p.y, p.m, p.d) + si * 3) % pool.length;
        }
        text = pool[idx];
        label = slot.name;
      }
    }

    if (!text || text === tipText) return;
    tipText = text;

    const lab = $("#tipLabel");
    if (lab) lab.textContent = label;

    const el = $("#tip");
    el.classList.add("fade");
    setTimeout(() => {
      el.textContent = text;
      el.classList.remove("fade");
    }, 220);
  }

  /* =====================================================================
     11. 状态行
     ===================================================================== */
  let statusCache = "";
  function renderStatus() {
    const p = nowParts();
    const hm = pad2(p.hh) + ":" + pad2(p.mm);
    let left = "更新 " + hm + " · Open-Meteo";
    if (state.stale) left = "离线缓存 " + hm;
    if (DEMO_MODE) left = "演示数据 · " + hm;
    if (state.todoSource === "local") left += " · 本地待办";
    if (left === statusCache) return;
    statusCache = left;
    $("#statusL").textContent = left;
  }

  /* =====================================================================
     12. 待办面板
     ===================================================================== */
  const sheet = $("#sheet");

  function renderSheet() {
    const p = nowParts();
    $("#sheetDate").textContent = p.m + "月" + p.d + "日 · " + p.wd;

    const list = sortItems(state.todos);

      box.innerHTML = '<div class="empty">还没有待办。在上面的输入框写一条就行。</div>';
      return;
    }

      '<div class="srow' + (t.done ? " done" : "") + '" data-id="' + t.id + '">' +
        '<button class="cb" data-act="toggle" aria-label="标记完成"></button>' +
        '<input class="t" data-act="text" value="' + esc(t.text) +
          '" enterkeyhint="done" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="内容">' +
        '<input class="tm" type="time" data-act="time" value="' + esc(t.time || "") + '" aria-label="时间">' +
        '<button class="del" data-act="del" aria-label="删除">×</button>' +
      "</div>"
    ).join("");
  }

  function openSheet() {
    renderSheet();
    sheet.classList.add("on");
    setTimeout(() => { const el = $("#addText"); if (el) el.focus(); }, 90);
  }

  function closeSheet() {

    sheet.classList.remove("on");
    renderTodos();
    renderStatus();
  }

  $("#addForm").addEventListener("submit", e => {
    e.preventDefault();
    const text = $("#addText").value;
    if (!text.trim()) { $("#addText").focus(); return; }
    addTodo(text, $("#addTime").value);
    $("#addText").value = "";
    $("#addTime").value = "";
    $("#addText").focus();
  });

  $("#sheetList").addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const row = el.closest(".srow");
    if (!row) return;
    if (el.dataset.act === "toggle") { toggleTodo(row.dataset.id); renderSheet(); }

  $("#sheetList").addEventListener("change", e => {
    const el = e.target;
    const act = el.dataset && el.dataset.act;
    if (act !== "text" && act !== "time") return;
    const row = el.closest(".srow");
    if (!row) return;
    const item = state.todos.find(x => x.id === row.dataset.id);
    if (!item) return;

    if (act === "text") {
      const v = el.value.trim();
      if (!v) { deleteTodo(item.id); return; }
      item.text = v;
    } else {
      item.time = el.value || "";
    }
    saveTodos();
    renderTodos();
    renderStatus();
    if (act === "time") renderSheet();
  });

  $("#sheetList").addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.dataset && e.target.dataset.act === "text") {
      e.preventDefault();
      e.target.blur();
    }
  });

  $("#btnClose").addEventListener("click", closeSheet);

  $("#btnClearDone").addEventListener("click", () => {
    if (!state.todos.some(t => t.done)) return;
    state.todos = state.todos.filter(t => !t.done);
    saveTodos();
    renderTodos();
    renderSheet();
    renderStatus();
  });

  $("#btnImport").addEventListener("click", async () => {
    try {
      const j = await getJSON(CONFIG.todos.url, 6000);
      const arr = Array.isArray(j) ? j : (j && j.items);
      if (!Array.isArray(arr)) throw new Error("bad json");
      if (state.todos.length && !window.confirm("用 todos.json 覆盖这台 iPad 上的清单？")) return;
      state.todos = arr.map(normTodo).filter(t => t.text);
      saveTodos();
      renderTodos();
      renderSheet();
      renderStatus();
    } catch (err) {
      window.alert("读不到 todos.json。\n如果你是在本地双击打开的，浏览器不允许读同目录文件，属于正常现象。");
    }
  });

  // 入口：点「今日」、点「＋ 添加待办」、三击时钟
  ["#todoHead", "#addLine"].forEach(sel => {
    const el = $(sel);
    if (el) el.addEventListener("click", openSheet);
  });

  let taps = 0, tapTimer = null;
  $("#clock").addEventListener("click", () => {
    taps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { taps = 0; }, 700);
    if (taps >= 3) { taps = 0; clearTimeout(tapTimer); openSheet(); }
  });

  document.addEventListener("keydown", e => {
    const tag = (e.target.tagName || "").toLowerCase();
    const typing = tag === "input" || tag === "textarea";
    if (e.key === "Escape") {
      if (statsEl.classList.contains("on")) closeStats(); else closeSheet();
      return;
    }
    if (!typing && (e.key === "e" || e.key === "E") && !sheet.classList.contains("on")) openSheet();
  });

  /* =====================================================================
     13. 统计
     ===================================================================== */
  const statsEl = $("#stats");

  function dayUTC(k) {
    const p = String(k).split("-").map(Number);
    return Date.UTC(p[0], p[1] - 1, p[2]);
  }
  function utcKey(ms) {
    const d = new Date(ms);
    return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
  }
  function lvl(n) { return n >= 7 ? 4 : n >= 5 ? 3 : n >= 3 ? 2 : n >= 1 ? 1 : 0; }

  // 历史 + 今天（实时）合并成一张日期表
  function allDays() {
    const map = {};
    Object.keys(state.history || {}).forEach(k => {
      const items = (state.history[k] && state.history[k].items) || [];
      map[k] = { items: items, total: items.length, done: items.filter(i => i.d).length };
    });
    const tk = dayKey();
    map[tk] = {
      items: state.todos.map(t => ({ t: t.text, m: t.time, d: t.done ? 1 : 0 })),
      total: state.todos.length,
      done: state.todos.filter(t => t.done).length,
      live: true
    };
    return map;
  }

  function renderStats() {
    const map = allDays();
    const keys = Object.keys(map).filter(k => map[k].total > 0).sort();
    const totalItems = keys.reduce((a, k) => a + map[k].total, 0);
    const totalDone = keys.reduce((a, k) => a + map[k].done, 0);
    const rate = totalItems ? Math.round(totalDone / totalItems * 100) : 0;

    const todayUTC = dayUTC(dayKey());

    // 连续「当天全部完成」的天数（今天还没记录就从昨天算起）
    let streak = 0;
    for (let i = 0; i < 500; i++) {
      const d = map[utcKey(todayUTC - i * 86400000)];
      if (!d || !d.total) { if (i === 0) continue; break; }
      if (d.done === d.total) streak++;
      else if (i === 0) continue;
      else break;
    }

    const num = (v, label) => '<span class="n"><b>' + v + "</b><span>" + label + "</span></span>";
    $("#stNums").innerHTML =
      num(keys.length, "记录天数") + num(totalItems, "累计事项") +
      num(rate + "%", "完成率") + num(streak, "连续完成");

    // ---- 过去一年：一天一格 ----
    const dow = (new Date(todayUTC).getUTCDay() + 6) % 7; // 周一 = 0
    const startUTC = todayUTC - (51 * 7 + dow) * 86400000;
    let cells = "", months = "", lastM = -1;
    for (let w = 0; w < 52; w++) {
      let label = "";
      for (let d = 0; d < 7; d++) {
        const ms = startUTC + (w * 7 + d) * 86400000;
        const k = utcKey(ms);
        const rec = map[k];
        const L = lvl(rec ? rec.done : 0);
        let cls = ms > todayUTC ? "void" : (L ? "l" + L : "");
        if (k === dayKey()) cls += " today";
        cells += '<i class="' + cls.trim() + '"></i>';
        if (d === 0) {
          const m = new Date(ms).getUTCMonth();
          if (m !== lastM) { lastM = m; label = (m + 1) + "月"; }
        }
      }
      months += "<span>" + label + "</span>";
    }
    $("#hmGrid").innerHTML = cells;
    $("#hmMonths").innerHTML = months;
    $("#hmRange").textContent =
      utcKey(startUTC).replace(/-/g, ".") + " — " + dayKey().replace(/-/g, ".");

    // ---- 最近 30 天：浅色没做完，深色做完 ----
    const maxDay = Math.max(3, Object.keys(map).reduce((a, k) => Math.max(a, map[k].total), 0));
    let bars = "", axis = "";
    for (let i = 29; i >= 0; i--) {
      const ms = todayUTC - i * 86400000;
      const k = utcKey(ms);
      const rec = map[k];
      const t = rec ? rec.total : 0, dn = rec ? rec.done : 0;
      bars += '<div class="bar' + (t ? "" : " empty") + '">' +
        (t
          ? '<span class="u" style="height:' + ((t - dn) / maxDay * 100).toFixed(1) + '%"></span>' +
            '<span class="f" style="height:' + (dn / maxDay * 100).toFixed(1) + '%"></span>'
          : "") +
      "</div>";
      const dt = new Date(ms);
      axis += "<span>" + (i % 7 === 0 || i === 29 ? (dt.getUTCMonth() + 1) + "/" + dt.getUTCDate() : "") + "</span>";
    }
    $("#bars").innerHTML = bars;
    $("#barsAxis").innerHTML = axis;
    $("#barsNote").textContent = "深色 = 已完成";

    // ---- 历史清单（按天展开）----
    const histKeys = keys.slice().reverse();
    if (!histKeys.length) {
      $("#hist").innerHTML = '<div class="empty">还没有记录。明天 0 点起，每天的清单会自动留档。</div>';
    } else {
      $("#hist").innerHTML = histKeys.map(k => {
        const r = map[k];
        const dt = new Date(dayUTC(k));
        const md = (dt.getUTCMonth() + 1) + "月" + dt.getUTCDate() + "日";
        const wd = "周" + ["日", "一", "二", "三", "四", "五", "六"][dt.getUTCDay()];
        const isToday = k === dayKey();
        const body = r.items.map(it =>
          '<div class="hi' + (it.d ? " done" : "") + '">' +
            '<span class="t">' + esc(it.t) + "</span>" +
            '<span class="m">' + esc(it.m || "") + "</span>" +
          "</div>").join("");
        return '<div class="hblock">' +
          '<div class="hrow' + (isToday ? " open" : "") + '" data-day="' + k + '">' +
            '<span class="d">' + (isToday ? "今天" : md) + "</span>" +
            '<span class="w">' + wd + "</span>" +
            "<span></span>" +
            '<span class="n">' + r.done + "/" + r.total + "</span>" +
            '<span class="c">›</span>' +
          "</div>" +
          '<div class="hitems">' + body + "</div>" +
        "</div>";
      }).join("");
    }
    $("#histNote").textContent = "共 " + histKeys.length + " 天";
    $("#backupNote").textContent = lastBackupText();
  }

  function openStats() { renderStats(); statsEl.classList.add("on"); }
  function closeStats() { statsEl.classList.remove("on"); }

  $("#btnStats").addEventListener("click", openStats);
  $("#btnStatsClose").addEventListener("click", closeStats);
  $("#hist").addEventListener("click", e => {
    const row = e.target.closest(".hrow");
    if (row) row.classList.toggle("open");
  });

  /* ---------- 备份：导出 / 恢复 ---------- */
  const BACKUP_KEY = "board.backupAt";

  function buildBackup() {
    return {
      app: "eink-board",
      v: 3,
      exportedAt: new Date().toISOString(),
      day: state.todoDay,
      items: state.todos,
      history: state.history || {}
    };
  }

  function applyBackup(data) {
    if (!data || typeof data !== "object") throw new Error("bad");
    const items = Array.isArray(data.items) ? data.items : null;
    const hist = data.history && typeof data.history === "object" ? data.history : null;
    if (!items && !hist) throw new Error("bad");

    state.todos = (items || []).map(normTodo).filter(t => t.text);
    state.history = {};
    Object.keys(hist || {}).forEach(k => {
      const d = hist[k];
      if (d && Array.isArray(d.items)) {
        state.history[k] = { items: d.items, at: d.at || 0 };
      }
    });
    state.todoDay = data.day || dayKey();
    saveTodos();
    renderTodos();
    renderStats();
    renderStatus();
  }

  function lastBackupText() {
    const at = +readJSON(BACKUP_KEY, 0) || 0;
    if (!at) return "从未备份";
    const days = Math.floor((Date.now() - at) / 86400000);
    if (days <= 0) return "上次备份：今天";
    return "上次备份：" + days + " 天前";
  }

  function markBackedUp() {
    writeJSON(BACKUP_KEY, Date.now());
    $("#backupNote").textContent = lastBackupText();
  }

  async function exportBackup() {
    const json = JSON.stringify(buildBackup(), null, 1);
    const name = "待办备份-" + dayKey() + ".json";

    // iPad：走系统分享面板，可直接存进「文件」/ iCloud Drive
    try {
      const file = new File([json], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "待办备份" });
        markBackedUp();
        return;
      }
    } catch (err) {
      if (err && err.name === "AbortError") return;
    }

    // 桌面浏览器：直接下载
    const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    markBackedUp();
  }

  $("#btnExport").addEventListener("click", exportBackup);
  $("#btnImportBackup").addEventListener("click", () => $("#fileBackup").click());

  $("#fileBackup").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    f.text().then(txt => {
      let data;
      try { data = JSON.parse(txt); } catch (err) { alert("这个文件不是有效的备份。"); return; }
      if (!window.confirm("用备份覆盖当前清单和全部历史？")) return;
      try { applyBackup(data); } catch (err) { alert("这个文件不是有效的备份。"); }
    }).catch(() => alert("读取文件失败。")).finally(() => { e.target.value = ""; });
  });

  /* =====================================================================
     14. 常亮 / 轮询 / 烧屏偏移
     ===================================================================== */
  let wakeLock = null;
  async function keepAwake() {
    if (!("wakeLock" in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } catch (e) {}
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      keepAwake();
      if (Date.now() - state.lastWeatherAt > CONFIG.weather.refreshMinutes * 60000) loadWeather();
      renderClock(true);
      syncFromStorage();
      checkBuild();
    }
  });

  // 从后台恢复 / 另一处写入时
  window.addEventListener("pageshow", () => { renderClock(true); syncFromStorage(); });
  window.addEventListener("storage", e => { if (e.key === TODO_KEY) syncFromStorage(); });

  // 部分浏览器要求先有用户手势才能申请常亮，首次触摸时补一次
  document.addEventListener("click", () => { if (!wakeLock) keepAwake(); }, { passive: true });

  // 屏幕像素轻微偏移，缓解 OLED 长时间静态显示
  if (CONFIG.display.pixelShift) {
    const board = $("#board");
    let s = 0;
    setInterval(() => {
      s = 1 - s;
      board.style.transform = s ? "translate(1px,1px)" : "translate(0,0)";
    }, 4 * 60 * 1000);
  }

  /* =====================================================================
     15. 自动跟进新版本
     ===================================================================== */
  const VER_KEY = "board.lastCheck";

  async function checkBuild() {
    if (location.protocol === "file:") return;   // 本地双击打开时跳过
    const now = Date.now();
    if (now - (+readJSON(VER_KEY, 0) || 0) < 30 * 60000) return;
    writeJSON(VER_KEY, now);
    try {
      const r = await fetch(location.pathname + "?t=" + now, { cache: "no-store" });
      if (!r.ok) return;
      const html = await r.text();
      const m = html.match(/const BUILD = "([^"]+)"/);
      if (!m || m[1] === BUILD) return;
      // 线上已经是新版本：重载一次，并记住这次目标版本，避免反复刷新
      const guard = "board.reload." + m[1];
      if (sessionStorage.getItem(guard)) return;
      sessionStorage.setItem(guard, "1");
      location.reload();
    } catch (e) {}
  }

  /* =====================================================================
     16. 启动
     ===================================================================== */
  function init() {
    if (!CONFIG.display.showHint) $(".r", $("#statusline")).style.visibility = "hidden";
    $("#buildTag").textContent = BUILD + " · ";

    // 先用缓存秒开
    const cached = readJSON("board.weather", null);
    if (cached) { state.weather = cached; renderWeather(); }
    state.aqi = readJSON("board.aqi", null);

    renderClock(true);
    renderTip();
    renderTodos();
    renderStatus();

    loadWeather().then(renderStatus);
    loadAqi();
    loadIndoor();
    loadTodos().then(renderStatus);

    setInterval(() => { renderClock(false); renderStatus(); }, 1000);
    setInterval(loadWeather, Math.max(3, CONFIG.weather.refreshMinutes) * 60000);
    setInterval(loadAqi, Math.max(10, CONFIG.weather.refreshMinutes * 4) * 60000);
    setInterval(loadIndoor, Math.max(2, CONFIG.indoor.refreshMinutes) * 60000);
    if (CONFIG.tips.mode === "rotate") {
      setInterval(renderTip, Math.max(1, CONFIG.tips.rotateMinutes) * 60000);
    }

    // 调试 / 备用入口：URL 加 ?edit=1 直接打开编辑面板
    if (params.has("edit")) setTimeout(openSheet, 300);
    if (params.has("stats")) setTimeout(openStats, 300);

    keepAwake();
    setTimeout(checkBuild, 6000);
  }

  init();
})();
</script>
</body>
</html>
